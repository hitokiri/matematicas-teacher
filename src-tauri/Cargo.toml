[package]
name = "matematicas-teacher"
version = "0.1.0"
description = "AI-powered math problem solver with step-by-step explanations"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.22"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "rustls-tls", "blocking"] }
futures-util = "0.3"

# Local LLM inference - llama.cpp Rust bindings (temp disabled - build issue)
# llama_cpp_rs = "0.3.0"
# llama.cpp integrado en la app (como Handy con whisper): sin servidor ni puertos
# dynamic-backends: CPU/CUDA/Vulkan se cargan en tiempo de ejecucion segun el hardware
# mtmd: modelos con vision (leer dibujos)
llama-cpp-2 = { version = "0.1.158", features = ["dynamic-backends", "mtmd"] }
base64 = "0.22"
# Dependencia directa solo para que build.rs reciba DEP_LLAMA_BACKENDS_DIR y copie las .so
llama-cpp-sys-2 = "=0.1.158"

# HuggingFace model downloads (estilo Handy)
hf-hub = "0.3"

# Utilities
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
once_cell = "1"

# File compression (for model extraction if needed)
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
minijinja = { version = "2", features = ["loader", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

[dev-dependencies]
tempfile = "3"
mockall = "0.13"

[features]
default = ["custom-protocol", "cuda"]
custom-protocol = ["tauri/custom-protocol"]
# Backends de GPU (requieren CUDA toolkit / Vulkan SDK al compilar, no al ejecutar)
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

[profile.dev]
incremental = true
