# Pruebas en cada push y pull request (version solo CPU: no hace falta CUDA en GitHub)

name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (tipos, vitest y Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit -p .
      - name: Pruebas unitarias
        run: npm run test:run
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas de la interfaz
        run: npx playwright test --reporter=line

  rust:
    name: Rust (solo CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libclang-dev \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # el cache restaura el build script de sherpa-onnx como "hecho" pero no la carpeta que descarga
      # (target/sherpa-onnx-prebuilt); sin esto falla el enlace (-lsherpa-onnx-c-api). Se fuerza a correr.
      - name: Forzar la descarga de sherpa-onnx
        working-directory: src-tauri
        run: cargo clean -p sherpa-onnx-sys
      # tauri::generate_context! necesita la carpeta del frontend compilado
      - run: mkdir -p dist
      # el cache puede traer enlaces viejos de llama.cpp que hacen panicar al build.rs ("File exists")
      - name: Limpiar enlaces viejos de llama.cpp
        run: node scripts/clean-llama-libs.mjs debug
      - name: Pruebas
        working-directory: src-tauri
        run: cargo test --no-default-features
