# Genera los instaladores en tres versiones:
#
#   - Linux con GPU NVIDIA (CUDA): usa la GPU si la PC tiene una NVIDIA con driver, y si no, la CPU.
#     Funciona en cualquier PC, pero pesa mas porque incluye las librerias de CUDA
#     (no hace falta instalar el CUDA Toolkit, solo el driver de NVIDIA).
#   - Linux solo CPU: mas ligera; funciona en cualquier PC pero nunca usa la GPU.
#   - macOS (Apple Silicon): un .dmg con la app; usa la GPU integrada Metal. Se compila en un
#     runner de macOS, por eso va en un job aparte.
#
# Se ejecuta a mano (Actions -> Instaladores -> Run workflow) o al subir una etiqueta v* (v0.2.0),
# que ademas publica un Release con los instaladores.

name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Compilar llama.cpp con CUDA en los runners de GitHub tarda (varias arquitecturas de GPU)
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            name: Con GPU NVIDIA (CUDA)
            artifact: matematicas-teacher-con-GPU-NVIDIA
          - variant: cpu
            name: Solo CPU
            artifact: matematicas-teacher-solo-CPU

    steps:
      - uses: actions/checkout@v5

      - name: Liberar espacio en disco
        if: matrix.variant == 'gpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config cmake clang libclang-dev \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64

      - name: CUDA Toolkit 13.0 (solo version con GPU)
        if: matrix.variant == 'gpu'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-nvcc-13-0 cuda-cudart-dev-13-0 libcublas-dev-13-0
          echo "CUDA_PATH=/usr/local/cuda-13.0" >> "$GITHUB_ENV"
          echo "CUDACXX=/usr/local/cuda-13.0/bin/nvcc" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-13.0/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.variant }}

      - name: Dependencias de npm
        run: npm ci

      - name: Compilar y empaquetar
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: npm run package:${{ matrix.variant }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: instaladores/*
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon, Metal)
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema
        run: brew install cmake create-dmg llvm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos

      - name: Dependencias de npm
        run: npm ci

      - name: Compilar y empaquetar
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          # Apple clang 15 define __ARM_FEATURE_SVE con -march=armv9.2-a (la variante apple_m4
          # de ggml) pero no habilita las intrinsics de SVE: 'svexpa_f32' needs target feature sve.
          # cmake-rs ignora CFLAGS/CXXFLAGS, asi que se usa clang de Homebrew, que no define la
          # macro sin +sve. No se instala libomp: OpenMP no se encuentra y no se enlaza.
          #
          # Ese clang es mas nuevo que el SDK de Xcode 15.4: los headers de CoreFoundation (CF_ENUM)
          # fallan con '-Welaborated-enum-base' al compilar cpp-httplib. Como los flags por entorno
          # tampoco llegan, se usan wrappers que anaden -Wno-elaborated-enum-base siempre.
          llvm="$(brew --prefix llvm)/bin"
          mkdir -p "$RUNNER_TEMP/cc"
          printf '#!/bin/sh\nexec "%s/clang" -Wno-elaborated-enum-base "$@"\n' "$llvm" > "$RUNNER_TEMP/cc/clang"
          # clang++ ademas usa los headers de libc++ del SDK (no los de LLVM 23, donde <memory> ya no
          # llega por inclusion transitiva: 'no template named unique_ptr' en ggml-metal.cpp).
          sdk="$(xcrun --show-sdk-path)"
          printf '#!/bin/sh\nexec "%s/clang++" -Wno-elaborated-enum-base -nostdinc++ -isystem "%s/usr/include/c++/v1" "$@"\n' "$llvm" "$sdk" > "$RUNNER_TEMP/cc/clang++"
          chmod +x "$RUNNER_TEMP/cc/clang" "$RUNNER_TEMP/cc/clang++"
          export CC="$RUNNER_TEMP/cc/clang"
          export CXX="$RUNNER_TEMP/cc/clang++"
          npm run package:mac

      - uses: actions/upload-artifact@v7
        with:
          name: matematicas-teacher-macOS
          path: instaladores/*
          if-no-files-found: error

  release:
    name: Publicar Release
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: instaladores
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: instaladores/*
          body: |
            ## ¿Qué versión descargo?

            | Versión | Para quién | Tamaño |
            |---|---|---|
            | **con-GPU-NVIDIA** | PCs con tarjeta NVIDIA: la usa automáticamente (mucho más rápido). Si la PC no tiene NVIDIA, funciona igual con la CPU. | Grande (incluye CUDA) |
            | **solo-CPU** | PCs sin NVIDIA o si prefieres una descarga ligera. Nunca usa la GPU. | Pequeña |
            | **macOS** | Macs con Apple Silicon (M1–M4). Usa la GPU integrada (Metal). | Mediana |

            - `.deb`: Ubuntu / Debian → `sudo apt install ./matematicas-teacher_*.deb`
            - `.AppImage`: cualquier Linux → `chmod +x *.AppImage && ./matematicas-teacher_*.AppImage`
            - `.dmg`: macOS → abre el `.dmg`, arrastra **Matemáticas Teacher** a *Aplicaciones*. Como no está firmada por Apple, la primera vez ábrela con clic derecho → *Abrir* (o `xattr -dr com.apple.quarantine` si Gatekeeper la bloquea).

            Para la versión con GPU solo hace falta el driver de NVIDIA (`nvidia-smi` debe funcionar); no hay que instalar CUDA.
