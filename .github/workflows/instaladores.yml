# Genera los instaladores en tres versiones:
#
#   - Linux con GPU NVIDIA (CUDA): usa la GPU si la PC tiene una NVIDIA con driver, y si no, la CPU.
#     Funciona en cualquier PC, pero pesa mas porque incluye las librerias de CUDA
#     (no hace falta instalar el CUDA Toolkit, solo el driver de NVIDIA).
#   - Linux solo CPU: mas ligera; funciona en cualquier PC pero nunca usa la GPU.
#   - macOS (Apple Silicon): un .dmg con la app; usa la GPU integrada Metal. Se compila en un
#     runner de macOS, por eso va en un job aparte.
#   - Windows (x64, solo CPU): un instalador .exe (NSIS). Los runners de GitHub no tienen GPU,
#     por eso la version de Windows es solo CPU por ahora. Va en un job aparte.
#
# Se ejecuta a mano (Actions -> Instaladores -> Run workflow) o al subir una etiqueta v* (v0.2.0),
# que ademas publica un Release con los instaladores.

name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Compilar llama.cpp con CUDA en los runners de GitHub tarda (varias arquitecturas de GPU)
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            name: Con GPU NVIDIA (CUDA)
            artifact: matematicas-teacher-con-GPU-NVIDIA
          - variant: cpu
            name: Solo CPU
            artifact: matematicas-teacher-solo-CPU

    steps:
      - uses: actions/checkout@v5

      - name: Liberar espacio en disco
        if: matrix.variant == 'gpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config cmake clang libclang-dev \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-alsa gstreamer1.0-pulseaudio

      - name: CUDA Toolkit 13.0 (solo version con GPU)
        if: matrix.variant == 'gpu'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-nvcc-13-0 cuda-cudart-dev-13-0 libcublas-dev-13-0
          echo "CUDA_PATH=/usr/local/cuda-13.0" >> "$GITHUB_ENV"
          echo "CUDACXX=/usr/local/cuda-13.0/bin/nvcc" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-13.0/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.variant }}

      # el cache restaura el build script de sherpa-onnx como "hecho" pero no la carpeta que descarga
      # (target/sherpa-onnx-prebuilt); sin esto falla el enlace (-lsherpa-onnx-c-api). Se fuerza a correr.
      - name: Forzar la descarga de sherpa-onnx
        working-directory: src-tauri
        run: cargo clean -p sherpa-onnx-sys --release

      - name: Dependencias de npm
        run: npm ci

      - name: Compilar y empaquetar
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: npm run package:${{ matrix.variant }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: instaladores/*
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon, Metal)
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema
        run: brew install cmake create-dmg

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos

      # el cache restaura el build script de sherpa-onnx como "hecho" pero no la carpeta que descarga
      # (target/sherpa-onnx-prebuilt); sin esto falla el enlace (-lsherpa-onnx-c-api). Se fuerza a correr.
      - name: Forzar la descarga de sherpa-onnx
        working-directory: src-tauri
        run: cargo clean -p sherpa-onnx-sys --release

      - name: Dependencias de npm
        run: npm ci

      - name: Compilar y empaquetar
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          # Se usa el clang de Apple (Xcode 16 en macos-15), como hace Handy. El clang de Homebrew
          # (LLVM 23) compilaba pero daba .dylib vacios al enlazar y necesitaba varios parches.
          npm run package:mac

      - name: Verificar la firma ad-hoc de la app
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          # Con hardened runtime, macOS rechaza las librerias firmadas ad-hoc (Team IDs distintos)
          if codesign -dv "$app" 2>&1 | grep -q 'flags=.*runtime'; then
            echo "La app tiene hardened runtime y no cargaria sus librerias"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: matematicas-teacher-macOS
          path: instaladores/*
          if-no-files-found: error

  windows:
    name: Windows (x64, solo CPU)
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      # Como hace Handy: el FileTracker de MSBuild no soporta rutas >260 caracteres y el arbol
      # de cmake de llama.cpp es profundo; activar rutas largas evita FTK1011/MSB3491
      - name: Rutas largas (Windows)
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows

      # el cache restaura el build script de sherpa-onnx como "hecho" pero no la carpeta que descarga
      # (target/sherpa-onnx-prebuilt); sin esto falla el enlace (-lsherpa-onnx-c-api). Se fuerza a correr.
      - name: Forzar la descarga de sherpa-onnx
        working-directory: src-tauri
        run: cargo clean -p sherpa-onnx-sys --release

      - name: Dependencias de npm
        run: npm ci

      - name: Compilar y empaquetar
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: npm run package:win

      - uses: actions/upload-artifact@v7
        with:
          name: matematicas-teacher-Windows
          path: instaladores/*
          if-no-files-found: error

  release:
    name: Publicar Release
    needs: [build, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: instaladores
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: instaladores/*
          body: |
            ## ¿Qué versión descargo?

            | Versión | Para quién | Tamaño |
            |---|---|---|
            | **con-GPU-NVIDIA** | PCs con tarjeta NVIDIA: la usa automáticamente (mucho más rápido). Si la PC no tiene NVIDIA, funciona igual con la CPU. | Grande (incluye CUDA) |
            | **solo-CPU** | PCs sin NVIDIA o si prefieres una descarga ligera. Nunca usa la GPU. | Pequeña |
            | **macOS** | Macs con Apple Silicon (M1–M4). Usa la GPU integrada (Metal). | Mediana |
            | **Windows** | PCs con Windows 10/11 (x64). Solo CPU por ahora. | Pequeña |

            - `.deb`: Ubuntu / Debian → `sudo apt install ./matematicas-teacher_*.deb`
            - `.AppImage`: cualquier Linux → `chmod +x *.AppImage && ./matematicas-teacher_*.AppImage`
            - `.dmg`: macOS → abre el `.dmg`, arrastra **Matemáticas Teacher** a *Aplicaciones*. Como no está firmada por Apple, macOS la bloquea la primera vez: en macOS 15 (Sequoia) ve a *Ajustes del Sistema → Privacidad y seguridad* y pulsa *Abrir igualmente*; en macOS 14, clic derecho → *Abrir*. También funciona en Terminal: `xattr -dr com.apple.quarantine "/Applications/Matematicas Teacher.app"`.
            - `.exe`: Windows → ejecuta el instalador. Como no está firmado, SmartScreen puede avisar: *Más información* → *Run anyway*.

            Para la versión con GPU solo hace falta el driver de NVIDIA (`nvidia-smi` debe funcionar); no hay que instalar CUDA.
