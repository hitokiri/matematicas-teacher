name: Diagnostico macOS (llama-cpp-sys-2)

# Compila la app en macOS y muestra que deja cmake en out/lib (los .dylib salian vacios).
# Se lanza a mano: gh workflow run diagnostico-macos.yml --ref main
on:
  workflow_dispatch:

jobs:
  diag:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: "macos-15 con dynamic-backends", runner: macos-15, estatico: "no" }
          - { nombre: "macos-15 estatico",             runner: macos-15, estatico: "si" }
          - { nombre: "macos-26 con dynamic-backends", runner: macos-26, estatico: "no" }
    steps:
      - uses: actions/checkout@v5
      - run: brew install cmake
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci && npm run build
      - name: Variante estatica (sin dynamic-backends)
        if: matrix.estatico == 'si'
        run: sed -i '' 's/"dynamic-backends", //' src-tauri/Cargo.toml && grep -n "^llama-cpp-2" src-tauri/Cargo.toml
      - name: Compilar
        id: build
        continue-on-error: true
        working-directory: src-tauri
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: cargo build --release --no-default-features --features custom-protocol 2>&1 | tail -40; exit ${PIPESTATUS[0]}
      - name: Que dejo cmake
        if: always()
        working-directory: src-tauri
        run: |
          echo "resultado del build: ${{ steps.build.outcome }}"
          for d in target/release/build/llama-cpp-sys-2-*/out/lib target/release/build/llama-cpp-sys-2-*/out/backends target/release; do
            echo "== $d"; ls -lO "$d" 2>/dev/null | grep -i "dylib\|\.a$" || true
          done
          echo "== dylib de 0 bytes"; find target/release -name "*.dylib" -size 0 | head -20
          echo "== inodos (hard links)"; ls -li target/release/*.dylib 2>/dev/null | head
