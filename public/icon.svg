<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icono de Matematicas Teacher: pizarra con los cuatro signos en tiza de colores.
       Fuente de todos los iconos: `npm run icono` genera los PNG, .ico e .icns. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="madera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86b38"/>
      <stop offset="1" stop-color="#7a4a22"/>
    </linearGradient>
    <radialGradient id="pizarra" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#3b7d5c"/>
      <stop offset="1" stop-color="#1f4d37"/>
    </radialGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado con el degradado de la app -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#fondo)"/>
  <rect x="64" y="64" width="896" height="448" rx="208" fill="url(#brillo)"/>

  <!-- Sombra, marco de madera y pizarra -->
  <rect x="158" y="246" width="724" height="520" rx="52" fill="#000" opacity="0.18"/>
  <rect x="150" y="226" width="724" height="520" rx="52" fill="url(#madera)"/>
  <rect x="190" y="266" width="644" height="440" rx="26" fill="url(#pizarra)"/>
  <!-- Rastros de tiza borrada -->
  <path d="M240 330 q120 -30 260 0" stroke="#ffffff" stroke-opacity="0.07" stroke-width="40" fill="none" stroke-linecap="round"/>
  <path d="M520 650 q120 20 260 -10" stroke="#ffffff" stroke-opacity="0.06" stroke-width="36" fill="none" stroke-linecap="round"/>

  <!-- Signos en tiza: + − × ÷ -->
  <g stroke-linecap="round" fill="none" stroke-width="46">
    <path d="M306 382 h132 M372 316 v132" stroke="#fff7e6"/>
    <path d="M588 382 h132" stroke="#ffe066"/>
    <path d="M318 538 l108 108 M426 538 l-108 108" stroke="#a7e3ff"/>
    <path d="M588 592 h132" stroke="#ff9ecb"/>
  </g>
  <circle cx="654" cy="530" r="24" fill="#ff9ecb"/>
  <circle cx="654" cy="654" r="24" fill="#ff9ecb"/>

  <!-- Repisa con un gis -->
  <rect x="222" y="746" width="580" height="40" rx="20" fill="#6b4220"/>
  <rect x="586" y="716" width="128" height="36" rx="14" fill="#ffffff" transform="rotate(-8 650 734)"/>
</svg>
